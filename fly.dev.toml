app = "leadsnebula-rust-dev"
primary_region = "iad"

[build]

[env]
  ENVIRONMENT = "development"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[services.http_checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/live"
  protocol = "http"
  tls_skip_verify = false

[deploy]
  # Release command disabled - using --no-release-command in workflow
  # Migrations can be run manually if needed: flyctl ssh console -a leadsnebula-rust-dev -C "/app/run-migrations"
  # release_command = "/app/run-migrations"

