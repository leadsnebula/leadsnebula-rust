app = "leadsnebula-rust-dev"
primary_region = "iad"

[build]

[env]
  ENVIRONMENT = "development"

[http_service]
  internal_port = 8080
  force_https = true
  # Manual control only: machine stays up when started, stays off when stopped. No auto-stop, no auto-start.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/live"

[deploy]
  # Release command disabled - using --no-release-command in workflow
  # Migrations can be run manually if needed: flyctl ssh console -a leadsnebula-rust-dev -C "/app/run-migrations"
  # release_command = "/app/run-migrations"

