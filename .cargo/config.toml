[alias]
# Fast tests: unit tests only, no database required (~3 seconds)
test-fast = "test --lib --no-fail-fast"

# Slow tests: integration tests with database, sequential execution (~2 minutes)
test-slow = "test --test '*' --no-fail-fast --locked -- --test-threads=1"

# All tests: full test suite with all features
test-all = "test --all-targets --all-features --locked"

# Nextest aliases (faster parallel execution)
nextest-fast = "nextest run --lib --locked --all-features"
nextest-slow = "nextest run --test '*' --locked --all-features"
nextest-all = "nextest run --locked --all-features"

# Clean corrupted artifacts (WSL crash recovery)
# Removes corrupted rlib files from known problematic crates (proptest, loom, AWS SDK)
clean-corrupt = "clean -p proptest -p loom -p aws-sdk-ssm -p aws-sdk-sesv2"

# CRITICAL: Use faster linker (lld) instead of bfd to reduce memory usage during linking
# bfd is slow/memory-heavy for large crates; lld is faster/lower-mem
# This prevents WSL OOM crashes during linking phase
# Install clang/lld in WSL: sudo apt install clang lld
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
