[profile.default]
retries = { backoff = "exponential", count = 2, delay = "1s" }
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
retries = { backoff = "exponential", count = 3, delay = "1s" }
slow-timeout = { period = "180s", terminate-after = 2 }
# Override for database-heavy tests that may hang on Neon cold starts
[[profile.ci.overrides]]
filter = 'test(test_otp_backup_codes_storage)'
slow-timeout = { period = "240s", terminate-after = 2 }

# WSL profile: Longer timeouts for slow Neon free-tier, prevent resource exhaustion
[profile.wsl]
retries = { backoff = "exponential", count = 2, delay = "2s" }
slow-timeout = { period = "300s", terminate-after = 1 }
