[package]
name = "leadsnebula-utils"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "create-user"
path = "src/bin/create-user.rs"

[[bin]]
name = "run-migrations"
path = "src/bin/run-migrations.rs"

[[bin]]
name = "update-password"
path = "src/bin/update-password.rs"

[[bin]]
name = "update-redis-url"
path = "src/bin/update-redis-url.rs"

[[bin]]
name = "fetch-ssm-values"
path = "src/bin/fetch-ssm-values.rs"

[[bin]]
name = "test-redis-connection"
path = "src/bin/test-redis-connection.rs"

[[bin]]
name = "query-publisher"
path = "src/bin/query-publisher.rs"

[[bin]]
name = "create-test-data"
path = "src/bin/create-test-data.rs"

[[bin]]
name = "check-user"
path = "src/bin/check-user.rs"

[[bin]]
name = "test-password"
path = "src/bin/test-password.rs"

[[bin]]
name = "cleanup-deleted-buyers"
path = "src/bin/cleanup-deleted-buyers.rs"

[[bin]]
name = "add-solar-vertical-to-buyers"
path = "src/bin/add-solar-vertical-to-buyers.rs"

[[bin]]
name = "add-vertical-to-buyer"
path = "src/bin/add-vertical-to-buyer.rs"

[[bin]]
name = "fix-solar2-buyer"
path = "src/bin/fix-solar2-buyer.rs"

[[bin]]
name = "generate-encryption-key"
path = "src/bin/generate-encryption-key.rs"

[[bin]]
name = "test-encryption"
path = "src/bin/test-encryption.rs"

[[bin]]
name = "apply-single-migration"
path = "src/bin/apply-single-migration.rs"

[[bin]]
name = "verify-email-index"
path = "src/bin/verify-email-index.rs"

[[bin]]
name = "validate-config"
path = "src/bin/validate-config.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-native-tls", "postgres", "migrate"] }
redis = { workspace = true }
leadsnebula_core = { path = "../core" }
anyhow = { workspace = true }
dotenv = { workspace = true }
clap = { version = "4", features = ["derive"] }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
serde_yaml = "0.9"

