[package]
name = "leadsnebula-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "leadsnebula-api"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
leadsnebula_core = { path = "../core", features = ["otp", "webauthn"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dotenv = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
rust_decimal = { workspace = true }
base64 = { workspace = true }
base32 = "0.4"
urlencoding = "2.1"
async-trait = "0.1"
jsonwebtoken = { workspace = true }
webauthn-rs = { version = "0.4", optional = true }
url = { version = "2", optional = true }

# Optional features
sentry = { version = "0.32", optional = true }
sentry-tower = { version = "0.32", optional = true }

[features]
default = ["webauthn"]
sentry = ["dep:sentry", "dep:sentry-tower", "leadsnebula_core/sentry"]
webauthn = ["dep:webauthn-rs", "dep:url", "leadsnebula_core/webauthn"]

[dev-dependencies]
ctor = { workspace = true }
dotenv = { workspace = true }