[package]
name = "leadsnebula_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("tracing", "sentry", "webauthn", "otp"))'] }

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
sqlx = { workspace = true }
aws-sdk-ssm = { workspace = true }
aws-sdk-sesv2 = { workspace = true }
aws-config = { workspace = true }
aws-smithy-async = { workspace = true }
bb8 = { workspace = true }
redis = { workspace = true }
argon2 = { workspace = true }
jsonwebtoken = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
pbkdf2 = { workspace = true }
sha1 = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rust_decimal = { workspace = true }
reqwest = { workspace = true }
once_cell = "1.19"
dotenvy = "0.15"
futures = { workspace = true }
moka = { version = "0.12", features = ["future"] }
simd-json = "0.13"
tokio-retry = { workspace = true }

# Optional features
sentry = { version = "0.32", optional = true }
webauthn-rs = { version = "0.4", optional = true, features = ["danger-allow-state-serialisation"] }
totp-rs = { version = "5", optional = true }
url = { version = "2", optional = true }

[features]
default = []
tracing = []
sentry = ["dep:sentry"]
webauthn = ["dep:webauthn-rs", "dep:url"]
otp = ["dep:totp-rs"]

[dev-dependencies]
proptest = { workspace = true }
loom = { workspace = true }
mockito = "1.2"
wiremock = "0.6"
criterion = { workspace = true }

[[bench]]
name = "ping_auction_bench"
path = "benches/ping_auction_bench.rs"
harness = false

[[bench]]
name = "auction_bench"
path = "benches/auction_bench.rs"
harness = false