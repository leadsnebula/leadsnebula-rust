[package]
name = "leadsnebula_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
sqlx = { workspace = true }
aws-sdk-ssm = { workspace = true }
aws-sdk-sesv2 = { workspace = true }
aws-config = { workspace = true }
aws-smithy-async = { workspace = true }
bb8 = { workspace = true }
redis = { workspace = true }
argon2 = { workspace = true }
jsonwebtoken = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rust_decimal = { workspace = true }
reqwest = { workspace = true }

# Optional features
sentry = { version = "0.32", optional = true }
webauthn-rs = { version = "0.4", optional = true }
totp-rs = { version = "5", optional = true }
url = { version = "2", optional = true }

[features]
default = []
sentry = ["dep:sentry"]
webauthn = ["dep:webauthn-rs", "dep:url"]
otp = ["dep:totp-rs"]

