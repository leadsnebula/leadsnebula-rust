name: Deploy to Dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.cursorrules'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and config
        run: |
          if [ "${{ github.ref }}" != "refs/heads/dev" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "ERROR: This workflow only deploys from dev branch or manual trigger"
            exit 1
          fi
          if [ ! -f "fly.dev.toml" ]; then
            echo "ERROR: fly.dev.toml not found"
            exit 1
          fi
          if [ -f "fly.toml" ]; then
            DEV_APP=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
            PROD_APP=$(grep '^app = ' fly.toml | cut -d'"' -f2)
            if [ "$DEV_APP" = "$PROD_APP" ]; then
              echo "ERROR: fly.toml and fly.dev.toml have the same app name - environments not separated"
              exit 1
            fi
          fi
          APP_NAME=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
          if [ -z "$APP_NAME" ]; then
            echo "ERROR: Could not extract app name from fly.dev.toml"
            exit 1
          fi
          echo "APP_NAME=${APP_NAME}" >> $GITHUB_ENV
          echo "Deploying to: ${APP_NAME}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:${{ github.sha }}-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io Dev
        run: |
          VERIFY_APP=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
          if [ "$VERIFY_APP" != "${{ env.APP_NAME }}" ]; then
            echo "ERROR: App name mismatch detected before deployment"
            exit 1
          fi
          if [ -f "fly.toml" ]; then
            PROD_APP=$(grep '^app = ' fly.toml | cut -d'"' -f2)
            if [ "$VERIFY_APP" = "$PROD_APP" ]; then
              echo "ERROR: Dev and production apps are the same - cross-environment deployment prevented"
              exit 1
            fi
          fi
          flyctl deploy \
            --image ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:${{ github.sha }}-dev \
            --config fly.dev.toml \
            --app ${{ env.APP_NAME }} \
            --remote-only=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check
        run: |
          for i in {1..10}; do
            sleep $((2 ** (i-1)))
            if curl -f https://${{ env.APP_NAME }}.fly.dev/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
          done
          echo "Health check failed after 10 attempts"
          exit 1

