name: Deploy to Dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.cursorrules'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify environment and config
        run: |
          if [ "${{ github.ref }}" != "refs/heads/dev" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "ERROR: This workflow only deploys from dev branch or manual trigger"
            exit 1
          fi
          if [ ! -f "fly.dev.toml" ]; then
            echo "ERROR: fly.dev.toml not found"
            exit 1
          fi
          if [ -f "fly.toml" ]; then
            DEV_APP=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
            PROD_APP=$(grep '^app = ' fly.toml | cut -d'"' -f2)
            if [ "$DEV_APP" = "$PROD_APP" ]; then
              echo "ERROR: fly.toml and fly.dev.toml have the same app name - environments not separated"
              exit 1
            fi
          fi
          APP_NAME=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
          if [ -z "$APP_NAME" ]; then
            echo "ERROR: Could not extract app name from fly.dev.toml"
            exit 1
          fi
          echo "APP_NAME=${APP_NAME}" >> $GITHUB_ENV
          echo "Deploying to: ${APP_NAME}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:${{ github.sha }}-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly.io app and secrets
        run: |
          echo "Validating Fly.io app: ${{ env.APP_NAME }}..."
          
          # Check if app exists and is accessible
          if ! flyctl status --app ${{ env.APP_NAME }} > /dev/null 2>&1; then
            echo "❌ App ${{ env.APP_NAME }} not found or not accessible"
            echo "Create it with: flyctl apps create ${{ env.APP_NAME }}"
            exit 1
          fi
          
          # Verify required secrets are documented
          # Note: flyctl secrets list doesn't show values, so we verify app exists
          # and provide clear documentation about required secrets
          echo "✅ App ${{ env.APP_NAME }} is accessible"
          echo ""
          echo "⚠️  Required secrets (verify manually or set if missing):"
          echo "   - ENVIRONMENT (e.g., 'development' or 'production')"
          echo "   - AWS_ACCESS_KEY_ID (for SSM access)"
          echo "   - AWS_SECRET_ACCESS_KEY (for SSM access)"
          echo "   - AWS_REGION (e.g., 'us-east-1')"
          echo ""
          echo "Set secrets with: flyctl secrets set KEY=value --app ${{ env.APP_NAME }}"
          echo "List secrets with: flyctl secrets list --app ${{ env.APP_NAME }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io Dev
        run: |
          VERIFY_APP=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
          if [ "$VERIFY_APP" != "${{ env.APP_NAME }}" ]; then
            echo "ERROR: App name mismatch detected before deployment"
            exit 1
          fi
          if [ -f "fly.toml" ]; then
            PROD_APP=$(grep '^app = ' fly.toml | cut -d'"' -f2)
            if [ "$VERIFY_APP" = "$PROD_APP" ]; then
              echo "ERROR: Dev and production apps are the same - cross-environment deployment prevented"
              exit 1
            fi
          fi
          echo "Deploying new image to Fly.io..."
          # Skip release command to avoid timeouts - migrations can be run manually if needed
          flyctl deploy \
            --image ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:${{ github.sha }}-dev \
            --config fly.dev.toml \
            --app ${{ env.APP_NAME }} \
            --remote-only=false \
            --skip-release-command
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check
        run: |
          echo "Waiting for deployment to stabilize before health checks..."
          sleep 20
          echo "Starting health checks..."
          # Use /live endpoint which works even in degraded mode
          for i in {1..10}; do
            if curl -f -s --max-time 5 https://${{ env.APP_NAME }}.fly.dev/live > /dev/null 2>&1; then
              echo "✅ Health check passed on attempt $i"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying in $((i * 2)) seconds..."
            sleep $((i * 2))
          done
          echo "❌ Health check failed after 10 attempts"
          echo "Checking app status and logs..."
          flyctl status --app ${{ env.APP_NAME }} || true
          echo "=== Recent logs ==="
          flyctl logs --app ${{ env.APP_NAME }} --no-tail || true
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

