name: Deploy to Dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.cursorrules'
  workflow_dispatch:
  workflow_run:
    workflows: ["Rust CI"]
    types:
      - completed
    branches: [dev]

jobs:
  deploy:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      checks: read
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Rust CI tests
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: 'Test Suite'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success
          timeout-seconds: 1800
        if: github.event_name == 'push'

      - name: Verify environment and config
        run: |
          if [ "${{ github.ref }}" != "refs/heads/dev" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "ERROR: This workflow only deploys from dev branch or manual trigger"
            exit 1
          fi
          if [ ! -f "fly.dev.toml" ]; then
            echo "ERROR: fly.dev.toml not found"
            exit 1
          fi
          if [ -f "fly.toml" ]; then
            DEV_APP=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
            PROD_APP=$(grep '^app = ' fly.toml | cut -d'"' -f2)
            if [ "$DEV_APP" = "$PROD_APP" ]; then
              echo "ERROR: fly.toml and fly.dev.toml have the same app name - environments not separated"
              exit 1
            fi
          fi
          APP_NAME=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
          if [ -z "$APP_NAME" ]; then
            echo "ERROR: Could not extract app name from fly.dev.toml"
            exit 1
          fi
          echo "APP_NAME=${APP_NAME}" >> $GITHUB_ENV
          echo "Deploying to: ${APP_NAME}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:${{ github.sha }}-dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # Build args for optimization
          build-args: |
            CARGO_BUILD_JOBS=4
            CARGO_INCREMENTAL=1

      - name: Pre-deployment validation
        run: |
          echo "🔍 Running pre-deployment validation..."
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:${{ github.sha }}-dev"
          
          # Pull the image we just built
          docker pull "$IMAGE_TAG" || {
            echo "❌ Failed to pull Docker image"
            exit 1
          }
          
          # Test 1: Verify image has required binaries
          echo "📦 Checking required binaries..."
          docker run --rm "$IMAGE_TAG" ls -la /app/leadsnebula-api /app/run-migrations || {
            echo "❌ Required binaries missing"
            exit 1
          }
          
          # Test 2: Verify liveness endpoint works (without dependencies)
          echo "🏥 Testing liveness endpoint..."
          # Start container in background
          CONTAINER_ID=$(docker run -d -p 8080:8080 \
            -e ENVIRONMENT=development \
            "$IMAGE_TAG" || echo "")
          
          if [ -z "$CONTAINER_ID" ]; then
            echo "❌ Failed to start container"
            exit 1
          fi
          
          # Wait for container to start
          sleep 5
          
          # Check if container is still running
          if ! docker ps | grep -q "$CONTAINER_ID"; then
            echo "❌ Container exited unexpectedly"
            docker logs "$CONTAINER_ID" || true
            docker rm -f "$CONTAINER_ID" || true
            exit 1
          fi
          
          # Test liveness endpoint
          MAX_RETRIES=10
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f -s --max-time 5 http://localhost:8080/live > /dev/null 2>&1; then
              echo "✅ Liveness endpoint responding"
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Liveness endpoint not responding after $MAX_RETRIES attempts"
              docker logs "$CONTAINER_ID" || true
              docker rm -f "$CONTAINER_ID" || true
              exit 1
            fi
            sleep 2
          done
          
          # Verify response format
          RESPONSE=$(curl -s --max-time 5 http://localhost:8080/live || echo "")
          if ! echo "$RESPONSE" | grep -q '"status".*"alive"'; then
            echo "❌ Invalid liveness response format"
            echo "Response: $RESPONSE"
            docker logs "$CONTAINER_ID" || true
            docker rm -f "$CONTAINER_ID" || true
            exit 1
          fi
          
          # Cleanup
          docker rm -f "$CONTAINER_ID" || true
          
          echo "✅ Pre-deployment validation passed"

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly.io app and secrets
        run: |
          echo "Validating Fly.io app: ${{ env.APP_NAME }}..."
          
          # Check if app exists and is accessible
          if ! flyctl status --app ${{ env.APP_NAME }} > /dev/null 2>&1; then
            echo "❌ App ${{ env.APP_NAME }} not found or not accessible"
            echo "Create it with: flyctl apps create ${{ env.APP_NAME }}"
            exit 1
          fi
          
          # Verify required secrets are documented
          # Note: flyctl secrets list doesn't show values, so we verify app exists
          # and provide clear documentation about required secrets
          echo "✅ App ${{ env.APP_NAME }} is accessible"
          echo ""
          echo "⚠️  Required secrets (verify manually or set if missing):"
          echo "   - ENVIRONMENT (e.g., 'development' or 'production')"
          echo "   - AWS_ACCESS_KEY_ID (for SSM access)"
          echo "   - AWS_SECRET_ACCESS_KEY (for SSM access)"
          echo "   - AWS_REGION (e.g., 'us-east-1')"
          echo ""
          echo "Set secrets with: flyctl secrets set KEY=value --app ${{ env.APP_NAME }}"
          echo "List secrets with: flyctl secrets list --app ${{ env.APP_NAME }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Validate SSM Redis configuration
        run: |
          echo "Validating Redis URL in SSM..."
          # This will be checked at runtime, but we can verify AWS credentials are available
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "⚠️  AWS credentials not set in GitHub secrets - SSM access may fail at runtime"
            echo "Required secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION"
          else
            echo "✅ AWS credentials available for SSM access"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Deploy to Fly.io Dev
        run: |
          VERIFY_APP=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
          if [ "$VERIFY_APP" != "${{ env.APP_NAME }}" ]; then
            echo "ERROR: App name mismatch detected before deployment"
            exit 1
          fi
          if [ -f "fly.toml" ]; then
            PROD_APP=$(grep '^app = ' fly.toml | cut -d'"' -f2)
            if [ "$VERIFY_APP" = "$PROD_APP" ]; then
              echo "ERROR: Dev and production apps are the same - cross-environment deployment prevented"
              exit 1
            fi
          fi
          echo "Deploying new image to Fly.io..."
          # Retry deploy up to 3 times in case of transient Fly.io API issues
          for attempt in {1..3}; do
            if flyctl deploy \
              --image ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:${{ github.sha }}-dev \
              --config fly.dev.toml \
              --app ${{ env.APP_NAME }} \
              --remote-only=false \
              --skip-release-command; then
              echo "✅ Deployment successful on attempt $attempt"
              break
            else
              if [ "$attempt" -eq 3 ]; then
                echo "❌ Deployment failed after 3 attempts"
                exit 1
              fi
              echo "⚠️  Deployment attempt $attempt failed, retrying in 30 seconds..."
              sleep 30
            fi
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment health
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          echo "Checking machine status and Fly.io health checks..."
          # Wait for machine to be in "started" state
          for i in {1..15}; do
            STATUS=$(flyctl machines list --app ${{ env.APP_NAME }} --json 2>/dev/null | jq -r '.[0].state // "unknown"' || echo "unknown")
            if [ "$STATUS" = "started" ]; then
              echo "✅ Machine is started"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "⚠️  Machine status still $STATUS after 15 attempts"
            else
              echo "Machine status: $STATUS (attempt $i/15)..."
              sleep 2
            fi
          done
          # Wait additional time for app to fully start
          echo "Waiting for app to be ready..."
          sleep 10
          # Check Fly.io's internal health check status (more reliable than external curl)
          echo "Checking Fly.io health check status..."
          for i in {1..12}; do
            # Get health check status from Fly.io API
            HEALTH_STATUS=$(flyctl status --app ${{ env.APP_NAME }} --json 2>/dev/null | jq -r '.Machines[0].Checks[]? | select(.Name | contains("http")) | .Status // empty' | head -1 || echo "")
            if [ "$HEALTH_STATUS" = "passing" ]; then
              echo "✅ Fly.io health check is passing"
              # Also verify app is responding (optional, but good to check)
              if curl -f -s --max-time 5 https://${{ env.APP_NAME }}.fly.dev/live > /dev/null 2>&1; then
                echo "✅ External endpoint is also accessible"
                RESPONSE=$(curl -s --max-time 5 https://${{ env.APP_NAME }}.fly.dev/live 2>/dev/null || echo "")
                if echo "$RESPONSE" | grep -q '"mode".*"degraded"'; then
                  echo "⚠️  WARNING: App is running in degraded mode (Redis/DB may be unavailable)"
                  echo "Response: $RESPONSE"
                fi
              else
                echo "⚠️  External endpoint not yet accessible, but Fly.io health check is passing"
              fi
              exit 0
            fi
            if [ "$i" -eq 12 ]; then
              echo "⚠️  Health check status: ${HEALTH_STATUS:-not found} (after 12 attempts)"
              # If machine is started, deployment is likely successful - health check may be in grace period
              if [ "$STATUS" = "started" ]; then
                echo "✅ Machine is started - deployment successful"
                echo "⚠️  Health check may still be initializing (grace period: 60s)"
                echo "⚠️  This is normal during deployments - Fly.io will continue monitoring"
                exit 0
              fi
            else
              if [ -n "$HEALTH_STATUS" ]; then
                echo "Health check status: $HEALTH_STATUS (attempt $i/12)..."
              else
                echo "Health check not yet available (attempt $i/12)..."
              fi
              sleep 5
            fi
          done
          echo "❌ Health check verification failed"
          echo "Checking app status and logs..."
          flyctl status --app ${{ env.APP_NAME }} || true
          echo "=== Recent logs ==="
          flyctl logs --app ${{ env.APP_NAME }} --no-tail || true
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

