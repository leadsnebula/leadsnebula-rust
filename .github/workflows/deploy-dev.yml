name: Deploy to Dev

on:
  workflow_run:
    workflows: ["Rust CI"]
    types:
      - completed
    branches: [dev]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip requiring Rust CI success (hotfix only; run tests locally first)'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      checks: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "ERROR: FLY_API_TOKEN secret is missing. Set it in repo Settings → Secrets."
            exit 1
          fi
          echo "Required secrets present"

      - name: Verify environment and config
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "ERROR: Rust CI workflow did not complete successfully"
              exit 1
            fi
          fi
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.skip_tests }}" == "true" ]; then
            echo "Hotfix mode: skip_tests=true. Ensure you have run tests locally (e.g. autotestsall.sh) before deploying."
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.skip_tests }}" != "true" ]; then
            echo "Manual run without skip_tests: Rust CI is not re-run; ensure main branch is green or run tests locally."
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "ERROR: This workflow only deploys after Rust CI succeeds or manual trigger"
            exit 1
          fi
          if [ ! -f "fly.dev.toml" ]; then
            echo "ERROR: fly.dev.toml not found"
            exit 1
          fi
          if [ -f "fly.toml" ]; then
            DEV_APP=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
            PROD_APP=$(grep '^app = ' fly.toml | cut -d'"' -f2)
            if [ "$DEV_APP" = "$PROD_APP" ]; then
              echo "ERROR: fly.toml and fly.dev.toml have the same app name - environments not separated"
              exit 1
            fi
          fi
          APP_NAME=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
          if [ -z "$APP_NAME" ]; then
            echo "ERROR: Could not extract app name from fly.dev.toml"
            exit 1
          fi
          echo "APP_NAME=${APP_NAME}" >> $GITHUB_ENV

      - name: Validate SSM path for dev (optional when AWS secrets set)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "AWS secrets not set - skipping SSM path validation (ensure SSM uses /leadsnebula/dev/... manually)"
            exit 0
          fi
          if ! aws ssm get-parameters-by-path --path /leadsnebula/dev --max-results 1 --query 'Parameters[0].Name' --output text 2>/dev/null | grep -q '/leadsnebula/dev'; then
            echo "ERROR: SSM path validation failed. Dev deploy requires parameters under /leadsnebula/dev (e.g. /leadsnebula/dev/rust/db/connection_url)"
            exit 1
          fi
          echo "SSM path /leadsnebula/dev validated"

      - name: Set commit SHA
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            COMMIT_SHA="${{ github.sha }}"
          fi
          echo "COMMIT_SHA=${COMMIT_SHA}" >> $GITHUB_ENV
          echo "Deploying to: ${{ env.APP_NAME }} (commit: ${COMMIT_SHA})"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:${{ env.COMMIT_SHA }}-dev
          # Optimized caching: Use both GHA cache and registry cache for maximum hit rate
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:cache-dev
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:cache-dev,mode=max
          platforms: linux/amd64
          # Build args for optimization
          build-args: |
            CARGO_BUILD_JOBS=4
            CARGO_INCREMENTAL=1
            BUILDKIT_INLINE_CACHE=1

      - name: Pre-deployment validation
        run: |
          echo "🔍 Running pre-deployment validation..."
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:${{ env.COMMIT_SHA }}-dev"
          
          # Pull the image we just built
          docker pull "$IMAGE_TAG" || {
            echo "❌ Failed to pull Docker image"
            exit 1
          }
          
          # Test 1: Verify image has required binaries
          echo "📦 Checking required binaries..."
          docker run --rm "$IMAGE_TAG" ls -la /app/leadsnebula-api /app/run-migrations || {
            echo "❌ Required binaries missing"
            exit 1
          }
          
          # Test 2: Verify liveness endpoint works (without dependencies)
          echo "🏥 Testing liveness endpoint..."
          # Start container in background
          CONTAINER_ID=$(docker run -d -p 8080:8080 \
            -e ENVIRONMENT=development \
            "$IMAGE_TAG" 2>&1 | tail -1 | tr -d '\r\n' || echo "")
          
          # Validate container ID (should be 12+ characters, not necessarily 64)
          if [ -z "$CONTAINER_ID" ] || [ "${#CONTAINER_ID}" -lt 12 ]; then
            echo "❌ Failed to start container"
            echo "Container ID: '$CONTAINER_ID'"
            exit 1
          fi
          
          echo "Container started: $CONTAINER_ID"
          
          # Wait for container to start and server to initialize
          echo "Waiting for server to start..."
          sleep 5
          
          # Check container status
          CONTAINER_STATUS=$(docker ps -a --filter "id=$CONTAINER_ID" --format "{{.Status}}" 2>/dev/null || echo "")
          echo "Container status: ${CONTAINER_STATUS:-unknown}"
          
          # Test liveness endpoint (container may show errors in logs but endpoint should work)
          MAX_RETRIES=20
          RETRY_COUNT=0
          ENDPOINT_WORKING=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Try to reach the endpoint (even if container appears stopped, it might still be listening)
            if curl -f -s --max-time 3 http://localhost:8080/live > /dev/null 2>&1; then
              echo "✅ Liveness endpoint responding"
              ENDPOINT_WORKING=true
              break
            fi
            
            # Check if container still exists (running or stopped)
            if ! docker ps -a --filter "id=$CONTAINER_ID" --format "{{.ID}}" | grep -q .; then
              echo "⚠️  Container no longer exists, checking if it was removed..."
              docker logs "$CONTAINER_ID" 2>&1 | tail -20 || echo "Could not retrieve logs"
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Waiting for endpoint... (attempt $RETRY_COUNT/$MAX_RETRIES)"
              sleep 2
            fi
          done
          
          # Verify response format if endpoint is working
          if [ "$ENDPOINT_WORKING" = "true" ]; then
            RESPONSE=$(curl -s --max-time 3 http://localhost:8080/live 2>/dev/null || echo "")
            if echo "$RESPONSE" | grep -q '"status".*"alive"'; then
              echo "✅ Liveness endpoint response format is correct"
            else
              echo "⚠️  Liveness endpoint responded but format unexpected"
              echo "Response: $RESPONSE"
            fi
          else
            echo "❌ Liveness endpoint not responding after $MAX_RETRIES attempts"
            echo "Container logs:"
            docker logs "$CONTAINER_ID" 2>&1 | tail -40 || echo "Could not retrieve logs"
            echo ""
            echo "Container status:"
            docker ps -a --filter "id=$CONTAINER_ID" || echo "Container not found"
            docker rm -f "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          
          # Cleanup
          docker rm -f "$CONTAINER_ID" 2>/dev/null || true
          
          echo "✅ Pre-deployment validation passed"

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly.io app and secrets
        run: |
          echo "Validating Fly.io app: ${{ env.APP_NAME }}..."
          
          # Check if app exists (works even if no machines exist)
          # Use 'apps show' which returns app info regardless of machine state
          if ! flyctl apps show ${{ env.APP_NAME }} > /dev/null 2>&1; then
            echo "❌ App ${{ env.APP_NAME }} not found or not accessible"
            echo "Create it with: flyctl apps create ${{ env.APP_NAME }}"
            exit 1
          fi
          
          # Check machine state (may be empty if all machines were destroyed)
          MACHINE_COUNT=$(flyctl machines list --app ${{ env.APP_NAME }} --json 2>/dev/null | jq '. | length' || echo "0")
          if [ "$MACHINE_COUNT" = "0" ]; then
            echo "⚠️  App exists but has no machines (may have been destroyed due to crash loops)"
            echo "ℹ️  Deployment will create a new machine automatically"
          else
            echo "✅ App ${{ env.APP_NAME }} exists with $MACHINE_COUNT machine(s)"
          fi
          
          # Verify required secrets are documented
          # Note: flyctl secrets list doesn't show values, so we verify app exists
          # and provide clear documentation about required secrets
          echo ""
          echo "⚠️  Required secrets (verify manually or set if missing):"
          echo "   - ENVIRONMENT (e.g., 'development' or 'production')"
          echo "   - AWS_ACCESS_KEY_ID (for SSM access)"
          echo "   - AWS_SECRET_ACCESS_KEY (for SSM access)"
          echo "   - AWS_REGION (e.g., 'us-east-1')"
          echo ""
          echo "Set secrets with: flyctl secrets set KEY=value --app ${{ env.APP_NAME }}"
          echo "List secrets with: flyctl secrets list --app ${{ env.APP_NAME }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Validate SSM Redis configuration
        run: |
          echo "Validating Redis URL in SSM..."
          # This will be checked at runtime, but we can verify AWS credentials are available
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "⚠️  AWS credentials not set in GitHub secrets - SSM access may fail at runtime"
            echo "Required secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION"
          else
            echo "✅ AWS credentials available for SSM access"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Record current image for rollback
        id: rollback
        run: |
          # Tolerate flyctl non-JSON or errors (e.g. API/version differences); deploy proceeds, rollback may be unavailable
          RAW=$(flyctl releases list --app ${{ env.APP_NAME }} --json 2>/dev/null) || true
          PREV=""
          if [ -n "$RAW" ] && echo "$RAW" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
            PREV=$(echo "$RAW" | jq -r '.[0].imageRef // empty')
          fi
          if [ -n "$PREV" ]; then
            echo "previous_image=$PREV" >> $GITHUB_OUTPUT
            echo "Rollback image recorded: $PREV"
          else
            echo "previous_image=" >> $GITHUB_OUTPUT
            echo "No previous release or flyctl output not parseable (deploy will continue; rollback unavailable)"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io Dev
        run: |
          VERIFY_APP=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
          if [ "$VERIFY_APP" != "${{ env.APP_NAME }}" ]; then
            echo "ERROR: App name mismatch detected before deployment"
            exit 1
          fi
          if [ -f "fly.toml" ]; then
            PROD_APP=$(grep '^app = ' fly.toml | cut -d'"' -f2)
            if [ "$VERIFY_APP" = "$PROD_APP" ]; then
              echo "ERROR: Dev and production apps are the same - cross-environment deployment prevented"
              exit 1
            fi
          fi
          echo "Deploying new image to Fly.io..."
          # Retry deploy up to 3 times in case of transient Fly.io API issues
          for attempt in {1..3}; do
            if flyctl deploy \
              --image ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:${{ env.COMMIT_SHA }}-dev \
              --config fly.dev.toml \
              --app ${{ env.APP_NAME }} \
              --remote-only=false \
              --skip-release-command; then
              echo "✅ Deployment successful on attempt $attempt"
              break
            else
              if [ "$attempt" -eq 3 ]; then
                echo "❌ Deployment failed after 3 attempts"
                exit 1
              fi
              echo "⚠️  Deployment attempt $attempt failed, retrying in 30 seconds..."
              sleep 30
            fi
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment health
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          echo "Checking machine status..."
          # Accept "started" (running) or "stopped" (autostopped / scale-to-zero). Fail on crash/destroyed/unknown.
          for i in {1..15}; do
            STATUS=$(flyctl machines list --app ${{ env.APP_NAME }} --json 2>/dev/null | jq -r '.[0].state // "unknown"' || echo "unknown")
            case "$STATUS" in
              started)
                echo "✅ Machine is started - deployment successful"
                echo "ℹ️  Fly.io will continue monitoring health checks automatically"
                exit 0
                ;;
              stopped)
                echo "✅ Machine is stopped (Fly.io autostop/scale-to-zero) - deployment successful"
                echo "ℹ️  Machine will start on first request. Image was updated successfully."
                exit 0
                ;;
              crashed|destroyed)
                echo "❌ Machine in bad state: $STATUS"
                flyctl status --app ${{ env.APP_NAME }} || true
                echo "=== Recent logs ==="
                flyctl logs --app ${{ env.APP_NAME }} --no-tail || true
                exit 1
                ;;
              *)
                if [ "$i" -eq 15 ]; then
                  echo "⚠️  Machine status still $STATUS after 15 attempts"
                  flyctl status --app ${{ env.APP_NAME }} || true
                  echo "=== Recent logs ==="
                  flyctl logs --app ${{ env.APP_NAME }} --no-tail || true
                  exit 1
                fi
                echo "Machine status: $STATUS (attempt $i/15)..."
                sleep 2
                ;;
            esac
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test /live endpoint
        run: |
          APP_URL="https://${{ env.APP_NAME }}.fly.dev"
          echo "Checking $APP_URL/live ..."
          for i in {1..10}; do
            if curl -sf --max-time 10 "$APP_URL/live" | grep -q '"status".*"alive"'; then
              echo "✅ /live endpoint responded successfully"
              exit 0
            fi
            echo "Attempt $i/10 - waiting 5s..."
            sleep 5
          done
          echo "❌ /live endpoint did not respond after 10 attempts"
          exit 1

      - name: Upload deployment summary
        if: always()
        run: |
          SUMMARY_FILE="deployment-summary-${{ github.run_id }}.txt"
          : > "$SUMMARY_FILE"
          if [ -n "${{ env.APP_NAME }}" ]; then
            echo "=== flyctl status ===" >> "$SUMMARY_FILE"
            flyctl status --app ${{ env.APP_NAME }} >> "$SUMMARY_FILE" 2>&1 || true
            echo "" >> "$SUMMARY_FILE"
            echo "=== Recent logs ===" >> "$SUMMARY_FILE"
            flyctl logs --app ${{ env.APP_NAME }} --no-tail >> "$SUMMARY_FILE" 2>&1 || true
          else
            echo "Summary not available (job failed before APP_NAME was set)" >> "$SUMMARY_FILE"
          fi
          echo "Deployment summary written to $SUMMARY_FILE"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Upload deployment summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary-dev-${{ github.run_id }}
          path: deployment-summary-${{ github.run_id }}.txt

      - name: Rollback on health failure
        if: failure() && steps.rollback.outputs.previous_image != ''
        run: |
          echo "Health check failed - rolling back to previous image"
          flyctl deploy --image "${{ steps.rollback.outputs.previous_image }}" --config fly.dev.toml --app ${{ env.APP_NAME }} --remote-only=false --skip-release-command
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

