name: Deploy to Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.cursorrules'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "deploy-production" to confirm'
        required: true

jobs:
  deploy:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    # Enable "Required reviewers" in Settings → Environments → production so a human must approve before this job runs
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "ERROR: FLY_API_TOKEN secret is missing"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] || [ -z "${{ secrets.AWS_REGION }}" ]; then
            echo "ERROR: AWS secrets (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION) required for production"
            exit 1
          fi
          echo "Required secrets present"

      - name: Verify environment and config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.confirm_production }}" != "deploy-production" ]; then
              echo "ERROR: Production deployment requires confirmation. Type 'deploy-production' in the input field."
              exit 1
            fi
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ERROR: This workflow only deploys from main branch"
            exit 1
          fi
          if [ ! -f "fly.toml" ]; then
            echo "ERROR: fly.toml not found"
            exit 1
          fi
          if [ -f "fly.dev.toml" ]; then
            DEV_APP=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
            PROD_APP=$(grep '^app = ' fly.toml | cut -d'"' -f2)
            if [ "$DEV_APP" = "$PROD_APP" ]; then
              echo "ERROR: fly.toml and fly.dev.toml have the same app name - environments not separated"
              exit 1
            fi
          fi
          APP_NAME=$(grep '^app = ' fly.toml | cut -d'"' -f2)
          if [ -z "$APP_NAME" ]; then
            echo "ERROR: Could not extract app name from fly.toml"
            exit 1
          fi
          echo "APP_NAME=${APP_NAME}" >> $GITHUB_ENV
          echo "Deploying to: ${APP_NAME}"

      - name: Validate SSM path for production (optional when AWS secrets set)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "AWS secrets not set - skipping SSM path validation (ensure SSM uses /leadsnebula/prod/... manually)"
            exit 0
          fi
          if ! aws ssm get-parameters-by-path --path /leadsnebula/prod --max-results 1 --query 'Parameters[0].Name' --output text 2>/dev/null | grep -q '/leadsnebula/prod'; then
            echo "ERROR: SSM path validation failed. Production deploy requires parameters under /leadsnebula/prod"
            exit 1
          fi
          echo "SSM path /leadsnebula/prod validated"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:${{ github.sha }}-production
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Pre-deployment validation
        run: |
          echo "🔍 Running pre-deployment validation..."
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:${{ github.sha }}-production"
          
          # Pull the image we just built
          docker pull "$IMAGE_TAG" || {
            echo "❌ Failed to pull Docker image"
            exit 1
          }
          
          # Test 1: Verify image has required binaries
          echo "📦 Checking required binaries..."
          docker run --rm "$IMAGE_TAG" ls -la /app/leadsnebula-api /app/run-migrations || {
            echo "❌ Required binaries missing"
            exit 1
          }
          
          # Test 2: Verify liveness endpoint works (without dependencies)
          echo "🏥 Testing liveness endpoint..."
          # Start container in background
          CONTAINER_ID=$(docker run -d -p 8080:8080 \
            -e ENVIRONMENT=production \
            "$IMAGE_TAG" 2>&1 | tail -1 | tr -d '\r\n' || echo "")
          
          # Validate container ID (should be 12+ characters, not necessarily 64)
          if [ -z "$CONTAINER_ID" ] || [ "${#CONTAINER_ID}" -lt 12 ]; then
            echo "❌ Failed to start container"
            echo "Container ID: '$CONTAINER_ID'"
            exit 1
          fi
          
          echo "Container started: $CONTAINER_ID"
          
          # Wait for container to start and server to initialize
          echo "Waiting for server to start..."
          sleep 5
          
          # Check container status
          CONTAINER_STATUS=$(docker ps -a --filter "id=$CONTAINER_ID" --format "{{.Status}}" 2>/dev/null || echo "")
          echo "Container status: ${CONTAINER_STATUS:-unknown}"
          
          # Test liveness endpoint (container may show errors in logs but endpoint should work)
          MAX_RETRIES=20
          RETRY_COUNT=0
          ENDPOINT_WORKING=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Try to reach the endpoint (even if container appears stopped, it might still be listening)
            if curl -f -s --max-time 3 http://localhost:8080/live > /dev/null 2>&1; then
              echo "✅ Liveness endpoint responding"
              ENDPOINT_WORKING=true
              break
            fi
            
            # Check if container still exists (running or stopped)
            if ! docker ps -a --filter "id=$CONTAINER_ID" --format "{{.ID}}" | grep -q .; then
              echo "⚠️  Container no longer exists, checking if it was removed..."
              docker logs "$CONTAINER_ID" 2>&1 | tail -20 || echo "Could not retrieve logs"
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Waiting for endpoint... (attempt $RETRY_COUNT/$MAX_RETRIES)"
              sleep 2
            fi
          done
          
          # Verify response format if endpoint is working
          if [ "$ENDPOINT_WORKING" = "true" ]; then
            RESPONSE=$(curl -s --max-time 3 http://localhost:8080/live 2>/dev/null || echo "")
            if echo "$RESPONSE" | grep -q '"status".*"alive"'; then
              echo "✅ Liveness endpoint response format is correct"
            else
              echo "⚠️  Liveness endpoint responded but format unexpected"
              echo "Response: $RESPONSE"
            fi
          else
            echo "❌ Liveness endpoint not responding after $MAX_RETRIES attempts"
            echo "Container logs:"
            docker logs "$CONTAINER_ID" 2>&1 | tail -40 || echo "Could not retrieve logs"
            echo ""
            echo "Container status:"
            docker ps -a --filter "id=$CONTAINER_ID" || echo "Container not found"
            docker rm -f "$CONTAINER_ID" 2>/dev/null || true
            exit 1
          fi
          
          # Cleanup
          docker rm -f "$CONTAINER_ID" 2>/dev/null || true
          
          echo "✅ Pre-deployment validation passed"

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly.io app and secrets
        run: |
          echo "Validating Fly.io app: ${{ env.APP_NAME }}..."
          
          # Check if app exists (works even if no machines exist)
          # Use 'apps show' which returns app info regardless of machine state
          if ! flyctl apps show ${{ env.APP_NAME }} > /dev/null 2>&1; then
            echo "❌ App ${{ env.APP_NAME }} not found or not accessible"
            echo "Create it with: flyctl apps create ${{ env.APP_NAME }}"
            exit 1
          fi
          
          # Check machine state (may be empty if all machines were destroyed)
          MACHINE_COUNT=$(flyctl machines list --app ${{ env.APP_NAME }} --json 2>/dev/null | jq '. | length' || echo "0")
          if [ "$MACHINE_COUNT" = "0" ]; then
            echo "⚠️  App exists but has no machines (may have been destroyed due to crash loops)"
            echo "ℹ️  Deployment will create a new machine automatically"
          else
            echo "✅ App ${{ env.APP_NAME }} exists with $MACHINE_COUNT machine(s)"
          fi
          
          # Verify required secrets are documented
          # Note: flyctl secrets list doesn't show values, so we verify app exists
          # and provide clear documentation about required secrets
          echo ""
          echo "⚠️  Required secrets (verify manually or set if missing):"
          echo "   - ENVIRONMENT (e.g., 'development' or 'production')"
          echo "   - AWS_ACCESS_KEY_ID (for SSM access)"
          echo "   - AWS_SECRET_ACCESS_KEY (for SSM access)"
          echo "   - AWS_REGION (e.g., 'us-east-1')"
          echo ""
          echo "Set secrets with: flyctl secrets set KEY=value --app ${{ env.APP_NAME }}"
          echo "List secrets with: flyctl secrets list --app ${{ env.APP_NAME }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Validate SSM configuration (documentation)
        run: |
          echo "📋 SSM Configuration Requirements for Production"
          echo ""
          echo "AWS credentials are set as environment variables in Fly.io machines."
          echo "SSM validation happens at runtime when the application starts."
          echo ""
          echo "⚠️  Required SSM parameters (must use 'prod' path, not 'production'):"
          echo "   - /leadsnebula/prod/rust/db/connection_url"
          echo "   - /leadsnebula/prod/rust/auth/jwt_secret"
          echo "   - /leadsnebula/prod/rust/encryption/api_key_key"
          echo "   - /leadsnebula/prod/rust/redis/connection_url"
          echo ""
          echo "⚠️  Optional SSM parameters:"
          echo "   - /leadsnebula/prod/rust/monitoring/sentry_dsn"
          echo "   - /leadsnebula/prod/rust/email/from_address"
          echo ""
          echo "NOTE: The ENVIRONMENT variable is 'production', but SSM paths use '/leadsnebula/prod/rust/...'"
          echo "      (environment names are normalized: production → prod, development → dev)"
          echo ""
          echo "If deployment fails with 'DATABASE_URL not found in SSM', check that:"
          echo "  1. AWS credentials are set in Fly.io: flyctl secrets list --app ${{ env.APP_NAME }}"
          echo "  2. SSM parameters exist with 'prod' path (not 'production')"
          echo "  3. Fly.io machine has IAM permissions to access SSM"

      - name: Record current image for rollback
        id: rollback
        run: |
          PREV=$(flyctl releases list --app ${{ env.APP_NAME }} --json 2>/dev/null | jq -r '.[0].imageRef // empty')
          if [ -n "$PREV" ]; then
            echo "previous_image=$PREV" >> $GITHUB_OUTPUT
            echo "Rollback image recorded: $PREV"
          else
            echo "previous_image=" >> $GITHUB_OUTPUT
            echo "No previous release (first deploy?)"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io Production
        run: |
          VERIFY_APP=$(grep '^app = ' fly.toml | cut -d'"' -f2)
          if [ "$VERIFY_APP" != "${{ env.APP_NAME }}" ]; then
            echo "ERROR: App name mismatch detected before deployment"
            exit 1
          fi
          if [ -f "fly.dev.toml" ]; then
            DEV_APP=$(grep '^app = ' fly.dev.toml | cut -d'"' -f2)
            if [ "$VERIFY_APP" = "$DEV_APP" ]; then
              echo "ERROR: Production and dev apps are the same - cross-environment deployment prevented"
              exit 1
            fi
          fi
          echo "Deploying new image to Fly.io..."
          # Skip release command to avoid timeouts - migrations can be run manually if needed
          flyctl deploy \
            --image ghcr.io/${{ github.repository_owner }}/leadsnebula-rust:${{ github.sha }}-production \
            --config fly.toml \
            --app ${{ env.APP_NAME }} \
            --remote-only=false \
            --skip-release-command
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment health
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          echo "Checking machine status..."
          # Wait for machine to be in "started" state
          for i in {1..15}; do
            STATUS=$(flyctl machines list --app ${{ env.APP_NAME }} --json 2>/dev/null | jq -r '.[0].state // "unknown"' || echo "unknown")
            if [ "$STATUS" = "started" ]; then
              echo "✅ Machine is started - deployment successful"
              echo "ℹ️  Fly.io will continue monitoring health checks automatically"
              exit 0
            fi
            if [ "$i" -eq 15 ]; then
              echo "⚠️  Machine status still $STATUS after 15 attempts"
              echo "Checking app status and logs..."
              flyctl status --app ${{ env.APP_NAME }} || true
              echo "=== Recent logs ==="
              flyctl logs --app ${{ env.APP_NAME }} --no-tail || true
              exit 1
            else
              echo "Machine status: $STATUS (attempt $i/15)..."
              sleep 2
            fi
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test /live endpoint
        run: |
          APP_URL="https://${{ env.APP_NAME }}.fly.dev"
          echo "Checking $APP_URL/live ..."
          for i in {1..10}; do
            if curl -sf --max-time 10 "$APP_URL/live" | grep -q '"status".*"alive"'; then
              echo "✅ /live endpoint responded successfully"
              exit 0
            fi
            echo "Attempt $i/10 - waiting 5s..."
            sleep 5
          done
          echo "❌ /live endpoint did not respond after 10 attempts"
          exit 1

      - name: Upload deployment summary
        if: always()
        run: |
          SUMMARY_FILE="deployment-summary-${{ github.run_id }}.txt"
          : > "$SUMMARY_FILE"
          if [ -n "${{ env.APP_NAME }}" ]; then
            echo "=== flyctl status ===" >> "$SUMMARY_FILE"
            flyctl status --app ${{ env.APP_NAME }} >> "$SUMMARY_FILE" 2>&1 || true
            echo "" >> "$SUMMARY_FILE"
            echo "=== Recent logs ===" >> "$SUMMARY_FILE"
            flyctl logs --app ${{ env.APP_NAME }} --no-tail >> "$SUMMARY_FILE" 2>&1 || true
          else
            echo "Summary not available (job failed before APP_NAME was set)" >> "$SUMMARY_FILE"
          fi
          echo "Deployment summary written to $SUMMARY_FILE"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Upload deployment summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary-production-${{ github.run_id }}
          path: deployment-summary-${{ github.run_id }}.txt

      - name: Rollback on health failure
        if: failure() && steps.rollback.outputs.previous_image != ''
        run: |
          echo "Health check failed - rolling back to previous image"
          flyctl deploy --image "${{ steps.rollback.outputs.previous_image }}" --config fly.toml --app ${{ env.APP_NAME }} --remote-only=false --skip-release-command
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

