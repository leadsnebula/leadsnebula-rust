name: Rust CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build validate-config binary
        run: cargo build --release --bin validate-config

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Security audit (cargo audit)
        run: |
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit --locked
          fi
          cargo audit --deny warnings || echo "⚠️  cargo-audit found vulnerabilities (non-blocking)"

      - name: License check (cargo deny)
        run: |
          if ! command -v cargo-deny &> /dev/null; then
            cargo install cargo-deny --locked
          fi
          cargo deny check || echo "⚠️  cargo-deny found license issues (non-blocking)"

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for change detection

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build validate-config binary
        run: cargo build --release --bin validate-config

      - name: Cache cargo-nextest
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-nextest-${{ runner.os }}-

      - name: Install cargo-nextest
        run: |
          if [ -f ~/.cargo/bin/cargo-nextest ]; then
            echo "Using cached cargo-nextest"
          elif ! command -v cargo-nextest &> /dev/null; then
            cargo install cargo-nextest --locked
          fi

      - name: Detect changed crates
        id: changed-crates
        run: |
          # Get list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || echo "")
          else
            # For push events, compare with previous commit
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "")
          fi
          
          # Extract unique crate directory names from changed files
          CHANGED_CRATES=$(echo "$CHANGED_FILES" | grep -o '^crates/[^/]*' | sort -u | tr '\n' ' ' | xargs || echo "")
          
          if [ -z "$CHANGED_CRATES" ]; then
            # No crate-specific changes, run all tests
            echo "packages=" >> $GITHUB_OUTPUT
            echo "run_all=true" >> $GITHUB_OUTPUT
            echo "Changed crates: none (running all tests)"
          else
            # Map directory names to actual package names
            declare -A PKG_MAP=(
              ["core"]="leadsnebula_core"
              ["api"]="leadsnebula-api"
              ["utils"]="leadsnebula-utils"
            )
            
            # Build package filter arguments, filtering out binary-only packages for --lib tests
            # leadsnebula-api is binary-only (no lib.rs), so skip it for --lib tests
            PACKAGES=""
            LIB_PACKAGES=""
            for dir in $CHANGED_CRATES; do
              pkg_dir="${dir#crates/}"  # Remove "crates/" prefix
              pkg_name="${PKG_MAP[$pkg_dir]:-$pkg_dir}"  # Map or fallback to directory name
              PACKAGES="$PACKAGES -p $pkg_name"
              # Skip binary-only packages for --lib tests
              if [ "$pkg_name" != "leadsnebula-api" ]; then
                LIB_PACKAGES="$LIB_PACKAGES -p $pkg_name"
              fi
            done
            
            echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
            echo "lib_packages=$LIB_PACKAGES" >> $GITHUB_OUTPUT
            echo "run_all=false" >> $GITHUB_OUTPUT
            echo "Changed crates: $CHANGED_CRATES"
            echo "Package filter: $PACKAGES"
            echo "Library package filter: $LIB_PACKAGES"
          fi

      - name: Run unit tests with nextest
        run: |
          # Run unit tests (lib tests) in parallel with nextest
          # Use all available CPU cores for maximum parallelization
          if [ "${{ steps.changed-crates.outputs.run_all }}" == "true" ] || [ -z "${{ steps.changed-crates.outputs.packages }}" ]; then
            echo "Running all unit tests (no crate-specific changes detected)"
            cargo nextest run --lib --locked --all-features \
              --retries 2
          else
            # Use lib_packages which excludes binary-only crates
            LIB_PACKAGES="${{ steps.changed-crates.outputs.lib_packages }}"
            if [ -n "$LIB_PACKAGES" ]; then
              echo "Running tests for changed library crates: $LIB_PACKAGES"
              cargo nextest run --lib $LIB_PACKAGES --locked --all-features \
                --retries 2 || \
              # Fallback: if filtered tests fail, run all tests to ensure nothing broke
              (echo "⚠️ Filtered tests had issues, running full test suite..." && \
               cargo nextest run --lib --locked --all-features --retries 2)
            else
              echo "Only binary-only crates changed (no library tests to run)"
              echo "Skipping --lib tests (binary crates don't have library tests)"
            fi
          fi

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install cargo-nextest
        run: |
          if ! command -v cargo-nextest &> /dev/null; then
            cargo install cargo-nextest --locked
          fi

      - name: Wait for database
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          # Install postgresql-client if not available (for pg_isready)
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client || true
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Database not ready, waiting..."
            sleep 2
          done
          echo "✅ Database is ready"
          
          # Verify connection with correct credentials
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -c "SELECT 1" || {
            echo "❌ Failed to connect to database with postgres user"
            exit 1
          }
          echo "✅ Database connection verified"

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
        run: |
          # Verify DATABASE_URL is set correctly
          echo "DATABASE_URL is set to: ${DATABASE_URL}"
          
          # Run health endpoint tests
          cargo nextest run --test integration_health --locked --all-features \
            --retries 2 || \
          cargo test --test integration_health --locked --all-features
          
          # Run authentication integration tests
          # Note: sqlx::test handles database isolation automatically, so parallel execution is safe
          # If you encounter database conflicts locally, test with: cargo test --test integration_auth -- --test-threads=4
          cargo test --test integration_auth --locked --all-features
          
          # Run publisher CRUD tests
          cargo test --test integration_publisher_crud --locked --all-features
          
          # Run E2E tests
          cargo test --test integration_carina_e2e --locked --all-features

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration]
    # Only build release if we're on a branch that will deploy
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build release
        run: cargo build --release --locked

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Wait for database
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          # Install postgresql-client if not available (for pg_isready)
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client || true
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Database not ready, waiting..."
            sleep 2
          done
          echo "✅ Database is ready"

      - name: Generate coverage report
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          RUST_TEST_THREADS: 1
        run: |
          # Clean old coverage artifacts (optional but recommended)
          cargo llvm-cov clean --workspace || true
          
          # Generate coverage report - continue even if tests fail
          # Use --no-fail-fast to run all tests, and || true to continue even on failure
          cargo llvm-cov --locked --all-features \
            --lcov --output-path lcov.info \
            --workspace \
            --no-fail-fast || true
          
          # Verify lcov.info was generated
          if [ ! -f lcov.info ]; then
            echo "❌ Error: lcov.info was not generated"
            echo "   This usually means all tests failed or coverage instrumentation failed"
            exit 1
          fi
          
          # Show coverage summary
          echo "📊 Coverage report generated successfully"
          echo "File size: $(du -h lcov.info | cut -f1)"

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    # Only run on main branch or manual trigger (optional, not blocking)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Run Criterion benchmarks
        run: |
          cargo bench --bench ping_auction_bench --locked --all-features || echo "⚠️  Benchmarks failed (non-blocking)"
