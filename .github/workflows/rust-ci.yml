name: Rust CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch: {}  # Manual run: Actions → Rust CI → Run workflow → pick branch (e.g. dev)

env:
  CARGO_TERM_COLOR: always
  # Reduce test binary debug bloat for faster linking and test runs
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for change detection

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Detect changed Rust files
        id: changed-rust
        run: |
          # Get list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || echo "")
          else
            # For push events, compare with previous commit
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "")
          fi
          
          # Filter for Rust files (.rs, Cargo.toml, etc.)
          RUST_FILES=$(echo "$CHANGED_FILES" | grep -E '\.(rs|toml)$|^Cargo\.toml$|^Cargo\.lock$' || echo "")
          
          if [ -z "$RUST_FILES" ]; then
            echo "has_rust_changes=false" >> $GITHUB_OUTPUT
            echo "No Rust files changed - skipping lint/format"
          else
            echo "has_rust_changes=true" >> $GITHUB_OUTPUT
            # Extract unique crate directory names from changed files
            CHANGED_CRATES=$(echo "$RUST_FILES" | grep -o '^crates/[^/]*' | sort -u | tr '\n' ' ' | xargs || echo "")
            
            if [ -z "$CHANGED_CRATES" ]; then
              # Changes in root (Cargo.toml, etc.) - run all
              echo "packages=" >> $GITHUB_OUTPUT
              echo "run_all=true" >> $GITHUB_OUTPUT
            else
              # Map directory names to actual package names
              declare -A PKG_MAP=(
                ["core"]="leadsnebula_core"
                ["api"]="leadsnebula-api"
                ["utils"]="leadsnebula-utils"
              )
              
              PACKAGES=""
              for dir in $CHANGED_CRATES; do
                pkg_dir="${dir#crates/}"
                pkg_name="${PKG_MAP[$pkg_dir]:-$pkg_dir}"
                PACKAGES="$PACKAGES -p $pkg_name"
              done
              
              echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
              echo "run_all=false" >> $GITHUB_OUTPUT
            fi
            echo "Changed Rust files detected"
          fi

      - name: Check formatting
        run: |
          # On PRs always run full workspace so branch protection cannot be bypassed
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            cargo fmt --all --check
          elif [ "${{ steps.changed-rust.outputs.has_rust_changes }}" == "true" ]; then
            if [ "${{ steps.changed-rust.outputs.run_all }}" == "true" ] || [ -z "${{ steps.changed-rust.outputs.packages }}" ]; then
              cargo fmt --all --check
            else
              cargo fmt ${{ steps.changed-rust.outputs.packages }} --check
            fi
          else
            echo "No Rust changes (push) - skipping fmt check"
          fi

      - name: Run clippy
        run: |
          # On PRs always run full workspace so branch protection cannot be bypassed
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          elif [ "${{ steps.changed-rust.outputs.has_rust_changes }}" == "true" ]; then
            if [ "${{ steps.changed-rust.outputs.run_all }}" == "true" ] || [ -z "${{ steps.changed-rust.outputs.packages }}" ]; then
              cargo clippy --workspace --all-targets --all-features -- -D warnings
            else
              cargo clippy ${{ steps.changed-rust.outputs.packages }} --all-targets --all-features -- -D warnings
            fi
          else
            echo "No Rust changes (push) - skipping clippy"
          fi

      - name: Clean build artifacts
        if: always()  # Clean even if previous steps failed
        run: |
          echo "🧹 Build artifacts will be cleaned by rust-cache action"
          # rust-cache handles cleanup automatically, no manual cleanup needed

  test-integration:
    name: Integration Tests (ephemeral Neon branch)
    runs-on: ubuntu-latest
    needs: test-unit

    # Note: we use Neon branches as ephemeral Postgres instances for CI runs.
    # The previous Postgres service container is intentionally omitted.

    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      # Balance test binary size vs debug info (1 = line info for backtraces, faster than full debug)
      CARGO_PROFILE_TEST_DEBUG: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for change detection

      - name: Detect if integration tests needed
        id: needs-integration
        run: |
          # Get list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || echo "")
          else
            # For push events, compare with previous commit
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "")
          fi
          
          # Integration tests are in crates/api/tests/ and test API/core functionality
          # Run if API or core crates changed, or if integration test files themselves changed
          NEEDS_TESTS=false
          if echo "$CHANGED_FILES" | grep -qE '^crates/(api|core)/'; then
            NEEDS_TESTS=true
          elif echo "$CHANGED_FILES" | grep -qE '^crates/api/tests/'; then
            NEEDS_TESTS=true
          elif echo "$CHANGED_FILES" | grep -qE 'migrations/'; then
            # Schema changes require integration tests
            NEEDS_TESTS=true
          fi
          
          if [ "$NEEDS_TESTS" == "true" ]; then
            echo "needs_tests=true" >> $GITHUB_OUTPUT
            echo "✅ Integration tests needed (API/core/migrations changed)"
          else
            echo "needs_tests=false" >> $GITHUB_OUTPUT
            echo "⏭️  Skipping integration tests (no relevant changes)"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Cache cargo-nextest
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-nextest-${{ runner.os }}-

      - name: Install cargo-nextest
        run: |
          if [ -f ~/.cargo/bin/cargo-nextest ]; then
            echo "✅ Using cached cargo-nextest"
          elif ! command -v cargo-nextest &> /dev/null; then
            cargo install cargo-nextest --locked
          fi

      - name: Set branch expiration (TTL 24h)
        if: steps.needs-integration.outputs.needs_tests == 'true'
        id: set-expiry
        run: |
          EXPIRES=$(date -u -d '+24 hours' +%Y-%m-%dT%H:%M:%SZ)
          echo "expires_at=$EXPIRES" >> $GITHUB_OUTPUT

      - name: Create ephemeral Neon branch
        if: steps.needs-integration.outputs.needs_tests == 'true'
        id: create-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}
          expires_at: ${{ steps.set-expiry.outputs.expires_at }}

      - name: Set DATABASE_URL from Neon branch
        if: steps.needs-integration.outputs.needs_tests == 'true' && steps.create-branch.outcome == 'success'
        run: |
          CONNECTION="${{ steps.create-branch.outputs.db_url }}"
          if [[ "$CONNECTION" == *"?"* ]]; then CONNECTION="${CONNECTION}&sslnegotiation=direct"; else CONNECTION="${CONNECTION}?sslnegotiation=direct"; fi
          echo "DATABASE_URL=$CONNECTION" >> $GITHUB_ENV
          echo "EPHEMERAL_DB=1" >> $GITHUB_ENV
          echo "TEST_MODE=true" >> $GITHUB_ENV
          echo "TEST_POOL_MAX_CONNECTIONS=50" >> $GITHUB_ENV
          echo "TEST_POOL_ACQUIRE_TIMEOUT_SECS=120" >> $GITHUB_ENV

      - name: "Build workspace (single compile: bins + test targets)"
        if: steps.needs-integration.outputs.needs_tests == 'true'
        run: |
          echo "🔨 Building workspace (run-migrations, warm-test-pool, all test binaries)..."
          # Single build phase - avoids redundant compilation during migrations and tests
          cargo build --all-targets --locked --all-features --bin run-migrations --bin warm-test-pool
          cargo nextest list --all-targets --locked --all-features > /dev/null 2>&1 || \
            cargo test --no-run --all-targets --locked --all-features
          echo "✅ Build complete - migrations, warm-up, and tests will use pre-built binaries"

      - name: Apply migrations and warm up Neon compute
        if: steps.needs-integration.outputs.needs_tests == 'true'
        run: |
          echo "🗄️  Applying migrations and warming up Neon compute..."
          # Per Neon docs: "Memory buffers are cold after a compute wakes up - initial queries
          # may take longer until the memory buffers are warmed." Sequential warm-up is reliable;
          # parallel connections can overwhelm cold Neon and hang.
          ./target/debug/run-migrations 2>&1 || true
          timeout 30 ./target/debug/run-migrations 2>/dev/null || true
          sleep 2
          timeout 30 ./target/debug/run-migrations 2>/dev/null || true
          sleep 2
          # Warm create_test_pool path before integration tests; runs migrations_check,
          # key_tables_exist, and a trivial query. This warms the exact code path used by tests.
          echo "Warming create_test_pool path..."
          if WARM_OUTPUT=$(timeout 90 ./target/debug/warm-test-pool 2>&1); then
            echo "✅ create_test_pool path warmed"
          else
            echo "⚠️ warm-test-pool failed:"
            echo "$WARM_OUTPUT"
          fi
          sleep 2
          echo "✅ Neon compute warmed"

      - name: "Run integration tests (two-phase: matches autotestsall.sh)"
        if: steps.needs-integration.outputs.needs_tests == 'true'
        env:
          CI: "true"
          # RUN_HEAVY_TESTS is not set, so heavy tests (30-40s each) are skipped
          # Heavy tests are enabled in local runs via .env.local (RUN_HEAVY_TESTS=true)
          WRITE_BEHIND_FLUSH_TIMEOUT_SECS: "60"
        run: |
          echo "DATABASE_URL is set (ephemeral Neon branch)"
          
          # Phase 1: DB-heavy integration tests (sequential, matches autotestsall.sh)
          # MUST run with --test-threads=1 to avoid migration table race conditions
          echo "Phase 1: DB integration tests (sequential)..."
          timeout 480 cargo nextest run --test integration_auth --test integration_publisher_crud --test integration_leads_endpoint --test integration_carina_e2e --test integration_email --locked --all-features --run-ignored all --test-threads=1 -E 'not test(optimization_tests)' --profile ci || \
            timeout 480 cargo test --test integration_auth --test integration_publisher_crud --test integration_leads_endpoint --test integration_carina_e2e --test integration_email --locked --all-features -- --test-threads=1 --ignored
          
          # Phase 2: Unit + lib + other tests (parallel, matches autotestsall.sh)
          echo "Phase 2: Unit + lib + other tests (8 threads)..."
          timeout 600 cargo nextest run --all-targets --locked --all-features --run-ignored all --test-threads=8 \
            -E 'not test(optimization_tests) and not test(integration_auth) and not test(integration_publisher_crud) and not test(integration_leads_endpoint) and not test(integration_carina_e2e) and not test(integration_email)' \
            --profile ci

      - name: Install cargo-llvm-cov
        if: steps.needs-integration.outputs.needs_tests == 'true'
        run: |
          if ! command -v cargo-llvm-cov &> /dev/null; then
            cargo install cargo-llvm-cov --locked
          else
            echo "cargo-llvm-cov already installed"
          fi
          cargo llvm-cov --version

      - name: Generate coverage report (same Neon branch as integration tests)
        if: steps.needs-integration.outputs.needs_tests == 'true'
        env:
          RUST_TEST_THREADS: 1
        run: |
          cargo llvm-cov clean --workspace || true
          cargo llvm-cov --locked --all-features \
            --lcov --output-path lcov.info \
            --workspace \
            --no-fail-fast || true
          if [ ! -f lcov.info ]; then
            echo "❌ lcov.info was not generated"
            exit 1
          fi
          echo "📊 Coverage report generated (file size: $(du -h lcov.info | cut -f1))"

      - name: Upload coverage artifact
        if: steps.needs-integration.outputs.needs_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Clean build artifacts
        if: always()  # Clean even if tests failed
        run: |
          echo "🧹 Cleaning build artifacts to prevent accumulation..."
          # Only clean if we're not caching (GitHub Actions runners have limited disk space)
          # The rust-cache action handles artifact cleanup, so we can skip manual cleanup
          # to preserve artifacts for potential debugging
          echo "✅ Build artifacts will be cleaned by rust-cache action"

      - name: Delete ephemeral Neon branch
        if: always() && steps.needs-integration.outputs.needs_tests == 'true'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ci-${{ github.run_id }}

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      # Balance test binary size vs debug info (1 = line info for backtraces, faster than full debug)
      CARGO_PROFILE_TEST_DEBUG: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for change detection

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build validate-config binary
        run: cargo build --release --bin validate-config

      - name: Cache cargo-nextest
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-nextest-${{ runner.os }}-

      - name: Install cargo-nextest
        run: |
          if [ -f ~/.cargo/bin/cargo-nextest ]; then
            echo "Using cached cargo-nextest"
          elif ! command -v cargo-nextest &> /dev/null; then
            cargo install cargo-nextest --locked
          fi

      - name: Detect changed crates
        id: changed-crates
        run: |
          # Get list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || echo "")
          else
            # For push events, compare with previous commit
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "")
          fi
          
          # Extract unique crate directory names from changed files
          CHANGED_CRATES=$(echo "$CHANGED_FILES" | grep -o '^crates/[^/]*' | sort -u | tr '\n' ' ' | xargs || echo "")
          
          if [ -z "$CHANGED_CRATES" ]; then
            # No crate-specific changes, run all tests
            echo "packages=" >> $GITHUB_OUTPUT
            echo "run_all=true" >> $GITHUB_OUTPUT
            echo "Changed crates: none (running all tests)"
          else
            # Map directory names to actual package names
            declare -A PKG_MAP=(
              ["core"]="leadsnebula_core"
              ["api"]="leadsnebula-api"
              ["utils"]="leadsnebula-utils"
            )
            
            # Build package filter arguments, filtering out binary-only packages for --lib tests
            # leadsnebula-api and leadsnebula-utils are binary-only (no lib.rs), so skip them for --lib tests
            PACKAGES=""
            LIB_PACKAGES=""
            for dir in $CHANGED_CRATES; do
              pkg_dir="${dir#crates/}"  # Remove "crates/" prefix
              pkg_name="${PKG_MAP[$pkg_dir]:-$pkg_dir}"  # Map or fallback to directory name
              PACKAGES="$PACKAGES -p $pkg_name"
              # Skip binary-only packages for --lib tests
              if [ "$pkg_name" != "leadsnebula-api" ] && [ "$pkg_name" != "leadsnebula-utils" ]; then
                LIB_PACKAGES="$LIB_PACKAGES -p $pkg_name"
              fi
            done
            
            echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
            echo "lib_packages=$LIB_PACKAGES" >> $GITHUB_OUTPUT
            echo "run_all=false" >> $GITHUB_OUTPUT
            echo "Changed crates: $CHANGED_CRATES"
            echo "Package filter: $PACKAGES"
            echo "Library package filter: $LIB_PACKAGES"
          fi

      - name: Build unit test binaries (compile once)
        run: |
          echo "🔨 Building unit test binaries upfront..."
          # Build lib test binaries once - subsequent test runs will reuse them
          if [ "${{ steps.changed-crates.outputs.run_all }}" == "true" ] || [ -z "${{ steps.changed-crates.outputs.packages }}" ]; then
            cargo nextest list --lib --locked --all-features > /dev/null 2>&1 || \
              cargo test --no-run --lib --locked --all-features
          else
            LIB_PACKAGES="${{ steps.changed-crates.outputs.lib_packages }}"
            if [ -n "$LIB_PACKAGES" ]; then
              cargo nextest list --lib $LIB_PACKAGES --locked --all-features > /dev/null 2>&1 || \
                cargo test --no-run --lib $LIB_PACKAGES --locked --all-features
            else
              # Binary-only crates changed - still build all lib tests
              cargo nextest list --lib --locked --all-features > /dev/null 2>&1 || \
                cargo test --no-run --lib --locked --all-features
            fi
          fi
          echo "✅ Unit test binaries built - test runs will reuse them"

      - name: Run unit tests with nextest
        run: |
          # Run unit tests (lib tests) in parallel with nextest
          # Binaries are already built, so this will be fast
          # Use all available CPU cores for maximum parallelization
          if [ "${{ steps.changed-crates.outputs.run_all }}" == "true" ] || [ -z "${{ steps.changed-crates.outputs.packages }}" ]; then
            echo "Running all unit tests (no crate-specific changes detected)"
            cargo nextest run --lib --locked --all-features \
              --retries 2
          else
            # Use lib_packages which excludes binary-only crates
            LIB_PACKAGES="${{ steps.changed-crates.outputs.lib_packages }}"
            if [ -n "$LIB_PACKAGES" ]; then
              echo "Running tests for changed library crates: $LIB_PACKAGES"
              cargo nextest run --lib $LIB_PACKAGES --locked --all-features \
                --retries 2 || \
              # Fallback: if filtered tests fail, run all tests to ensure nothing broke
              (echo "⚠️ Filtered tests had issues, running full test suite..." && \
               cargo nextest run --lib --locked --all-features --retries 2)
            else
              # Binary-only crates changed - still run all lib tests to catch regressions
              # Binary crates may depend on library crates that need testing
              echo "Binary-only crates changed - running all library tests to catch regressions"
              cargo nextest run --lib --locked --all-features --retries 2
            fi
          fi

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration]
    # Only build release when pushing to dev (dev deploy runs after CI)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for change detection

      - name: Detect if build needed
        id: needs-build
        run: |
          # Get list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || echo "")
          else
            # For push events, compare with previous commit
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "")
          fi
          
          # Build if any Rust code changed
          NEEDS_BUILD=false
          if echo "$CHANGED_FILES" | grep -qE '\.(rs|toml)$|^Cargo\.toml$|^Cargo\.lock$'; then
            NEEDS_BUILD=true
          fi
          
          if [ "$NEEDS_BUILD" == "true" ]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "✅ Build needed (Rust code changed)"
          else
            echo "needs_build=false" >> $GITHUB_OUTPUT
            echo "⏭️  Skipping build (no Rust code changes)"
          fi

      - name: Install Rust toolchain
        if: steps.needs-build.outputs.needs_build == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        if: steps.needs-build.outputs.needs_build == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build release
        if: steps.needs-build.outputs.needs_build == 'true'
        run: cargo build --release --locked

      - name: Clean build artifacts
        if: always() && steps.needs-build.outputs.needs_build == 'true'
        run: |
          echo "🧹 Build artifacts will be cleaned by rust-cache action"
          # rust-cache handles cleanup automatically, no manual cleanup needed

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: false  # disabled; run locally: cargo bench --bench ping_auction_bench
    steps:
      - uses: actions/checkout@v4
      - run: cargo bench --bench ping_auction_bench --locked --all-features
