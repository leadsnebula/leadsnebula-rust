name: Rust CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for change detection

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install cargo-nextest
        run: |
          if ! command -v cargo-nextest &> /dev/null; then
            cargo install cargo-nextest --locked
          fi

      - name: Detect changed crates
        id: changed-crates
        run: |
          # Get list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || echo "")
          else
            # For push events, compare with previous commit
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "")
          fi
          
          # Extract unique crate names from changed files
          CHANGED_CRATES=$(echo "$CHANGED_FILES" | grep -o '^crates/[^/]*' | sort -u | tr '\n' ' ' | xargs || echo "")
          
          if [ -z "$CHANGED_CRATES" ]; then
            # No crate-specific changes, run all tests
            echo "packages=" >> $GITHUB_OUTPUT
            echo "run_all=true" >> $GITHUB_OUTPUT
            echo "Changed crates: none (running all tests)"
          else
            # Convert to package filter format (remove crates/ prefix, add -p prefix)
            PACKAGE_NAMES=$(echo "$CHANGED_CRATES" | sed 's|crates/||g' | xargs)
            if [ -z "$PACKAGE_NAMES" ]; then
              # Empty after processing, run all tests
              echo "packages=" >> $GITHUB_OUTPUT
              echo "run_all=true" >> $GITHUB_OUTPUT
              echo "Changed crates: $CHANGED_CRATES (but no valid package names, running all tests)"
            else
              # Build package filter arguments
              PACKAGES=""
              for pkg in $PACKAGE_NAMES; do
                PACKAGES="$PACKAGES -p $pkg"
              done
              echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
              echo "run_all=false" >> $GITHUB_OUTPUT
              echo "Changed crates: $CHANGED_CRATES"
              echo "Package filter: $PACKAGES"
            fi
          fi

      - name: Run unit tests with nextest
        run: |
          # Run unit tests (lib tests) in parallel with nextest
          # Use all available CPU cores for maximum parallelization
          if [ "${{ steps.changed-crates.outputs.run_all }}" == "true" ] || [ -z "${{ steps.changed-crates.outputs.packages }}" ]; then
            echo "Running all unit tests (no crate-specific changes detected)"
            cargo nextest run --lib --locked --all-features \
              --retries 2
          else
            echo "Running tests for changed crates: ${{ steps.changed-crates.outputs.packages }}"
            cargo nextest run --lib ${{ steps.changed-crates.outputs.packages }} --locked --all-features \
              --retries 2 || \
            # Fallback: if filtered tests fail, run all tests to ensure nothing broke
            (echo "⚠️ Filtered tests had issues, running full test suite..." && \
             cargo nextest run --lib --locked --all-features --retries 2)
          fi

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install cargo-nextest
        run: |
          if ! command -v cargo-nextest &> /dev/null; then
            cargo install cargo-nextest --locked
          fi

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          # Run integration tests with nextest for faster execution
          cargo nextest run --test integration_health --locked --all-features \
            --retries 2 || \
          cargo test --test integration_health --locked --all-features

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration]
    # Only build release if we're on a branch that will deploy
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build release
        run: cargo build --release --locked

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Generate coverage report
        run: |
          # Install cargo-llvm-cov if needed
          cargo install cargo-llvm-cov --locked || true
          cargo llvm-cov --locked --all-features --lcov --output-path lcov.info || true

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: lcov.info
