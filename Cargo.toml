[workspace]
members = [
    "crates/api",
    "crates/core",
    "crates/models",
    "crates/services",
    "crates/utils",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["leadsnebula <info@leadsnebula.com>"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "time"] }

# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
hyper = { version = "1.3", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }
sqlx-migrate = "0.1"

# AWS SDK
aws-sdk-ssm = "1.50"
aws-sdk-sesv2 = "1.50"
aws-config = "1.1"

# Encryption
ring = "0.17"
hex = "0.4"

# Authentication
jsonwebtoken = "9.3"
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
totp-rs = { version = "5.7", features = ["gen_secret", "otpauth"] }
rand = "0.8"
webauthn-rs = "0.4"
base64 = "0.22"
base32 = "0.4"
qrcode = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sentry = { version = "0.46.0", features = ["tower", "tracing"] }
sentry-tower = "0.46.0"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
bb8-redis = "0.12"

# Rate limiting
governor = "0.6"
tower-governor = "0.2"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.20"
parking_lot = "0.12"
urlencoding = "2.1"

# Testing
mockall = "0.13"
proptest = "1.5"
