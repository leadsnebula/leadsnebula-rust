[workspace]
members = ["crates/api", "crates/core", "crates/utils"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["LeadsNebula Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros", "tower-log"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json", "rust_decimal"] }

# AWS SDK
aws-sdk-ssm = { version = "1", default-features = false, features = ["rustls", "behavior-version-latest"] }
aws-sdk-sesv2 = { version = "1", default-features = false, features = ["rustls", "behavior-version-latest"] }
aws-config = { version = "1", default-features = false, features = ["rustls", "behavior-version-latest"] }
aws-smithy-async = { version = "1", features = ["rt-tokio"] }

# Redis
bb8 = "0.9"
redis = { version = "1.0", features = ["tokio-rustls-comp", "connection-manager", "tls-rustls"] }

# Crypto & Security
argon2 = "0.5"
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"

# Error handling
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
base64 = "0.21"
hex = "0.4"
dotenv = "0.15"
rust_decimal = { version = "1", features = ["serde-with-str"] }
reqwest = { version = "0.12", features = ["json"] }

# Testing dependencies
proptest = "1.4"
mockall = "0.13"
loom = "0.7"
criterion = { version = "0.5", features = ["html_reports"] }
tower-test = "0.4"
tokio-test = "0.4"
ctor = "0.2"

# Optional features (via feature flags) - defined in individual crates, not workspace

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

