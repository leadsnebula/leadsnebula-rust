# Cargo-deny configuration file
# This file configures license checking for the Rust project

[licenses]
# Allow common Rust ecosystem licenses
# These are standard, permissive licenses used by the Rust community
allow = [
    # Permissive licenses (most common in Rust ecosystem)
    "MIT",
    "Apache-2.0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
]

# Deny copyleft licenses (GPL, AGPL, etc.)
# These require derivative works to be open source
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
]

# Allow unknown licenses (for crates without explicit license)
# This is a safety net, but we should prefer crates with explicit licenses
allow-osi-fsf-free = "neither"

# Exemptions (if needed for specific crates)
# Add specific crate exemptions here if necessary
# exemptions = []

[licenses.private]
# Don't require licenses for private workspace crates
ignore = true
