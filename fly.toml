app = "leadsnebula-rust"
primary_region = "iad"

[build]

[env]
  ENVIRONMENT = "production"
  # Note: Set RUST_LOG=warn via `fly secrets set RUST_LOG=warn` for production
  # to disable feature-gated tracing and eliminate logging overhead.
  # Keep RUST_LOG=debug or RUST_LOG=info for development/staging.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/live"

[deploy]
  # Release command disabled - using --no-release-command in workflow
  # Migrations can be run manually if needed: flyctl ssh console -a leadsnebula-rust -C "/app/run-migrations"
  # release_command = "/app/run-migrations"

