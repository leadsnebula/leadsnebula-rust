app = "leadsnebula-rust"
primary_region = "iad"

[build]

[env]
  ENVIRONMENT = "production"
  # Production logging: WARN level eliminates INFO/DEBUG overhead in critical path
  # This reduces request latency by 100-300ms by avoiding log formatting/serialization
  # ERROR and WARN logs are preserved for troubleshooting
  # Set RUST_LOG=info or RUST_LOG=debug for development/staging via fly secrets
  RUST_LOG = "warn"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/live"

[deploy]
  # Release command disabled - using --no-release-command in workflow
  # Migrations can be run manually if needed: flyctl ssh console -a leadsnebula-rust -C "/app/run-migrations"
  # release_command = "/app/run-migrations"

